<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>

    <link rel="stylesheet" href="css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="board" data-board>
      <div class="board__column board__column--purple">
        <h2 class="board__column-title">To-Do</h2>
        <ul class="board__column-cards" data-column-name="todo"></ul>
        <button class="board__column-add-btn" data-action="addCard" data-column-name="todo">
          Add card
        </button>
      </div>

      <div class="board__column board__column--blue">
        <h2 class="board__column-title">In progress</h2>
        <ul class="board__column-cards" data-column-name="inProgress">
          <li class="board__column-card" data-card-id="ed077903-3317-41e9-9bc8-005c7b7a3559">
            <input type="text" placeholder="Введите название" class="board__column-card-title" data-card-title="">
            <textarea class="board__column-card-desc" placeholder="Введите описание" data-card-desc=""></textarea>
          </li>
        </ul>
        <button class="board__column-add-btn" data-action="addCard" data-column-name="inProgress">
          Add card
        </button>
      </div>

      <div class="board__column board__column--green">
        <h2 class="board__column-title">Done</h2>
        <ul class="board__column-cards" data-column-name="done"></ul>
        <button class="board__column-add-btn" data-action="addCard" data-column-name="done">
          Add card
        </button>
      </div>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
